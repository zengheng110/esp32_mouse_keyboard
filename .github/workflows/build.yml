name: Build ESP32-C3 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-action@v1
        with:
          esp_idf_version: v5.0
          target: esp32c3

      - name: Build firmware
        run: idf.py build

      - name: Check binary size
        run: idf.py size

      - name: Rename output binary
        run: cp build/esp32_mouse_keyboard.bin build/esp32c3_hid_mouse_keyboard.bin

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3_hid_mouse_keyboard
          path: |
            build/esp32c3_hid_mouse_keyboard.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
